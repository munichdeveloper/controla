# Standalone production file, not an override of docker-compose.yml.
# Requires a Docker-aware Traefik with host networking (see docs/HOSTINGER.md).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: controla
      POSTGRES_USER: controla_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controla_user -d controla"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=false

  controla:
    image: ${CONTROLA_IMAGE:-ghcr.io/munichdeveloper/controla:main}
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      SERVER_PORT: "8081"
      PORT: "3000"
      NEXT_PUBLIC_BACKEND_BASE_URL: /api
      BACKEND_URL: http://localhost:8081/api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/controla
      SPRING_DATASOURCE_USERNAME: controla_user
      # Required/non-empty validation is defined once on the postgres service.
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CONTROLA_SECURITY_MASTER_KEY: ${CONTROLA_SECURITY_MASTER_KEY:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      FRONTEND_URL: https://${CONTROLA_HOST:?Set the public hostname without scheme or path}
      CORS_ALLOWED_ORIGINS: https://${CONTROLA_HOST:?Set the public hostname without scheme or path}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@controla.local}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://host.docker.internal:8081}
      CORE_API_TOKEN: ${CORE_API_TOKEN:-}
      CORE_TENANT_ID: ${CORE_TENANT_ID:-123e4567-e89b-12d3-a456-426614174000}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${COMPOSE_PROJECT_NAME}_default
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${CONTROLA_HOST:?Set CONTROLA_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000

volumes:
  postgres_data:
