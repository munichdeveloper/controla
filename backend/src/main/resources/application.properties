spring.application.name=controla-backend
server.port=${SERVER_PORT:8081}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Shadow failure triage: decisions are logged and never affect alert delivery.
controla.triage.enabled=${CONTROLA_TRIAGE_ENABLED:false}
controla.triage.provider=${CONTROLA_TRIAGE_PROVIDER:rules}
controla.triage.jev.api-key=${CONTROLA_TRIAGE_JEV_API_KEY:}
controla.triage.jev.model=${CONTROLA_TRIAGE_JEV_MODEL:jev-latest}
controla.triage.jev.timeout-ms=${CONTROLA_TRIAGE_JEV_TIMEOUT_MS:5000}

# CORE API Configuration
core.base-url=${CORE_BASE_URL:http://localhost:8081}
core.api-token=${CORE_API_TOKEN:dev-apikey-123}
core.tenant-id=${CORE_TENANT_ID:123e4567-e89b-12d3-a456-426614174000}

# Database Configuration (PostgreSQL als Standard)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/controla}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:controla_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:controla_secure_password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security Configuration
# Master Key for encrypting API Keys (Change this in production!)
controla.security.master-key=${CONTROLA_SECURITY_MASTER_KEY:change-me-to-a-very-secure-random-string-32-chars}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mail Sender Configuration
mail.from=${MAIL_FROM:noreply@controla.local}
mail.from-name=${MAIL_FROM_NAME:controla}

# Password Reset Configuration
app.password-reset.token-validity-hours=${PASSWORD_RESET_TOKEN_VALIDITY_HOURS:24}

# Email Template Configuration
app.email.locale=${EMAIL_LOCALE:de_DE}
app.email.branding=${EMAIL_BRANDING:controla}

# Frontend URL for password reset links
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

