# Managed by pi-spec-harness: process-audit-receiver-reference v1
name: Harness Process Audit Receiver

# SPEC-005 process_audit receiver.
#
# Receives `repository_dispatch` events of type `process_audit` and
# delegates to the reusable process-audit-automation workflow in the harness
# repository for validated, idempotent, conflict-safe journal recording.
#
# Generated by pi-spec-harness `harness install process-audit-receiver`.
# Do not edit this file manually — re-run the install command to update.

on:
  repository_dispatch:
    types: [process_audit]

permissions:
  contents: write

jobs:
  record:
    uses: munichdeveloper/pi-spec-harness/.github/workflows/process-audit-automation.yml@402289e68f558a76ab62078b11f90a5e3d947416
    with:
      audit-payload-json: ${{ toJson(github.event.client_payload.audit) }}
      journal-dir: 'docs/process-audit/journal'
      harness-ref: '402289e68f558a76ab62078b11f90a5e3d947416'
      writer-auth-mode: 'github-app'
    secrets:
      audit-app-id: ${{ secrets.HARNESS_AUDIT_APP_ID }}
      audit-app-private-key: ${{ secrets.HARNESS_AUDIT_APP_PRIVATE_KEY }}
    permissions:
      contents: write
