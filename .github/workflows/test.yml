name: Test

on:
  push:
    branches: [ "**" ]
  pull_request: 
    branches: [ "**" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps: 
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Configure Maven Settings
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                      http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>github</id>
              <username>${{ github.actor }}</username>
              <password>${{ secrets.GITHUB_TOKEN }}</password>
            </server>
          </servers>
        </settings>
        EOF
    
    - name: Build and Test App
      working-directory: .
      run: mvn -B clean package

    - name: Report Backend Test Failures
      if: failure()
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as ET

        def escape(value):
            return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

        for report in Path('backend/target/surefire-reports').glob('TEST-*.xml'):
            for case in ET.parse(report).getroot().iter('testcase'):
                for failure in [*case.findall('failure'), *case.findall('error')]:
                    detail = failure.text or failure.get('message', '')
                    output = case.findtext('system-out', '')
                    detail += '\n' + '\n'.join(line for line in output.splitlines() if 'Docker' in line or 'Status 400' in line)
                    print(f"::error title={escape(case.get('classname', 'Backend test'))}::{escape(detail[:12000])}")
        PY
    
    - name: Run Backend Linting
      working-directory: .
      run: mvn checkstyle:check
      continue-on-error: true
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm test
