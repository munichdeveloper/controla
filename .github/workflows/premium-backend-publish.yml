name: Premium backend publish

# Lives only on premium/backend. Every merge to this branch builds the backend
# library and publishes it to GitHub Packages as <CE base>-premium.<run>,
# e.g. 1.3.0-premium.4. Premium pins that version in its pom.xml.
# CE releases from main are not used by Premium anymore.
on:
  push:
    branches: [premium/backend]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: premium-backend-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require premium/backend
        if: github.ref != 'refs/heads/premium/backend'
        run: |
          echo "::error::Publish only from premium/backend, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Determine version
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          VERSION="${base#v}-premium.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing $VERSION from $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build, test and publish backend library
        run: |
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B deploy -pl backend -am -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo
            echo "Pin in Premium pom.xml:"
            echo '```xml'
            echo "<version>$VERSION</version>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
