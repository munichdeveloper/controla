# Software Factory v0.4.3; independent immutable Harness v0.3.2 pin.
name: Software Factory
run-name: Factory ${{ (github.event_name == 'push' || github.event_name == 'workflow_run') && 'notify' || inputs.mode || 'manager' }} ${{ inputs.execution_id }}
on:
  push:
  workflow_run:
    workflows: [Test]
    types: [completed]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [manager, merge, notify, check-slack, bootstrap, worker]
        default: manager
      execution_id:
        type: string
        default: ''
      issue_number:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.repository }}-software-factory-${{ inputs.mode == 'worker' && inputs.execution_id || 'manager' }}
  cancel-in-progress: false
jobs:
  factory:
    if: inputs.mode != 'worker' && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    steps:
      - uses: munichdeveloper/software-factory@aebbcffb00077db9628c4c197e98c17abf198d11
        with:
          mode: ${{ (github.event_name == 'push' || github.event_name == 'workflow_run' || inputs.mode == 'merge') && 'notify' || inputs.mode || 'manager' }}
          dry-run: ${{ inputs.dry_run || false }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
  coding:
    if: inputs.mode == 'worker' && !inputs.dry_run
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: munichdeveloper/software-factory/.github/workflows/coding-worker.yml@aebbcffb00077db9628c4c197e98c17abf198d11
    with:
      factory-ref: aebbcffb00077db9628c4c197e98c17abf198d11
      harness-ref: 8f1732c05c351af32bd25a6306a92f3bb06c1bad
      execution-id: ${{ inputs.execution_id }}
      issue-number: ${{ inputs.issue_number }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  merge:
    needs: factory
    if: ${{ !cancelled() && inputs.mode != 'worker' && inputs.mode != 'check-slack' && inputs.mode != 'notify' && inputs.mode != 'bootstrap' && (needs.factory.result == 'success' || (needs.factory.result == 'failure' && (github.event_name == 'push' || github.event_name == 'workflow_run' || inputs.mode == 'merge'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: write
    steps:
      - uses: munichdeveloper/software-factory@aebbcffb00077db9628c4c197e98c17abf198d11
        with:
          mode: merge
          dry-run: ${{ inputs.dry_run || false }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
  merge-notifications:
    needs: merge
    if: always() && needs.merge.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read
    steps:
      - uses: munichdeveloper/software-factory@aebbcffb00077db9628c4c197e98c17abf198d11
        with:
          mode: notify
          dry-run: ${{ inputs.dry_run || false }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
