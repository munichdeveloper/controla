name: Factory Temporal executor
run-name: SF Temporal ${{ fromJSON(inputs.request).executionId }} ${{ inputs.binding }}
on:
  workflow_dispatch:
    inputs:
      request:
        type: string
        required: true
      binding:
        type: string
        required: true
      validation:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: sf-temporal-${{ fromJSON(inputs.request).executionId }}
  cancel-in-progress: false
jobs:
  code:
    permissions:
      contents: read
      actions: read
    uses: munichdeveloper/software-factory/.github/workflows/temporal-coding-executor.yml@a793898e06224d307ab8c10aa7faffe7fcd057d2
    with:
      factory-ref: a793898e06224d307ab8c10aa7faffe7fcd057d2
      harness-ref: 59d1364b337ed4e40d3beb12f4a0036078b12c59
      request: ${{ inputs.request }}
      validation: ${{ inputs.validation }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
