name: Factory Temporal executor
run-name: SF Temporal ${{ fromJSON(inputs.request).executionId }} ${{ inputs.binding }}
on:
  workflow_dispatch:
    inputs:
      request:
        type: string
        required: true
      binding:
        type: string
        required: true
      validation:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: sf-temporal-${{ fromJSON(inputs.request).executionId }}
  cancel-in-progress: false
jobs:
  code:
    permissions:
      contents: read
      actions: read
    uses: munichdeveloper/software-factory/.github/workflows/temporal-coding-executor.yml@227fd778d030b95f3f8863d669b3d0ffece9c31d
    with:
      factory-ref: 227fd778d030b95f3f8863d669b3d0ffece9c31d
      harness-ref: 7d571cb233db55075f7f26178c97a870142092f1
      request: ${{ inputs.request }}
      validation: ${{ inputs.validation }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
