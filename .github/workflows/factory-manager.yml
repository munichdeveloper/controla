# Software Factory v0.3.0; independent immutable Harness v0.3.2 pin.
name: Software Factory
run-name: Factory ${{ github.event_name == 'push' && 'notify' || inputs.mode || 'manager' }} ${{ inputs.execution_id }}
on:
  push:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [manager, notify, check-slack, bootstrap, worker]
        default: manager
      execution_id:
        type: string
        default: ''
      issue_number:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.repository }}-software-factory-${{ inputs.mode == 'worker' && inputs.execution_id || 'manager' }}
  cancel-in-progress: false
jobs:
  factory:
    if: inputs.mode != 'worker' && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    steps:
      - uses: munichdeveloper/software-factory@f85c87741f63270906745114c88b6004c5499986
        with:
          mode: ${{ github.event_name == 'push' && 'notify' || inputs.mode || 'manager' }}
          dry-run: ${{ inputs.dry_run || false }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
  coding:
    if: inputs.mode == 'worker' && !inputs.dry_run
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: munichdeveloper/software-factory/.github/workflows/coding-worker.yml@f85c87741f63270906745114c88b6004c5499986
    with:
      factory-ref: f85c87741f63270906745114c88b6004c5499986
      harness-ref: 8f1732c05c351af32bd25a6306a92f3bb06c1bad
      execution-id: ${{ inputs.execution_id }}
      issue-number: ${{ inputs.issue_number }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
