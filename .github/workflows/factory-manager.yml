name: Factory Temporal executor
run-name: SF Temporal ${{ fromJSON(inputs.request).executionId }} ${{ inputs.binding }}
on:
  workflow_dispatch:
    inputs:
      request:
        type: string
        required: true
      binding:
        type: string
        required: true
      validation:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: sf-temporal-${{ fromJSON(inputs.request).executionId }}
  cancel-in-progress: false
jobs:
  code:
    permissions:
      contents: read
      actions: read
    uses: munichdeveloper/software-factory/.github/workflows/temporal-coding-executor.yml@86365dc00cbb7fe24bb66fc93e77f5b66b63c004
    with:
      factory-ref: 86365dc00cbb7fe24bb66fc93e77f5b66b63c004
      harness-ref: b9b05462d83774011438ba66936b9cd1df441e3d
      request: ${{ inputs.request }}
      validation: ${{ inputs.validation }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
