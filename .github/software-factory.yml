version: 1
factory:
  enabled: true
  scope: "Implement explicitly SF-managed Controla Community tasks with Codex.
    Independently review and conditionally merge Factory PRs and PRs explicitly
    enrolled with sf:automerge. Respect AGENTS.md, the Community/Premium
    boundary, feature flags and backwards-compatible extension APIs. Historical
    tasks from retired orchestrators are not automatically enrolled."
manager:
  workflow: factory-manager.yml
  maxActions: 10
  timeoutMinutes: 15
  maxContextTasks: 20
  maxContextChars: 20000
  trustedActors:
    - github-actions[bot]
    - munichdeveloper-sf-manager-local[bot]
autonomy:
  profile: autonomous
  overrides:
    transition: allow
    close_issue: allow
    create_followup: allow
    prioritize: allow
    approve_task: allow
    start_worker: allow
    retry_worker: allow
    cancel_worker: allow
    expand_scope: deny
    merge_pr: allow # Mandatory independent AI review and native GitHub gates still apply.
execution:
  dryRun: false
  maxParallelWorkers: 1
  maxRetries: 2
  maxNewIssues: 3
  workerTimeoutMinutes: 30
  dispatchGraceMinutes: 10
  engine: temporal
llm:
  provider: openai
  model: gpt-4.1-mini
  reasoningEffort: null
  maxOutputTokens: 4000
  timeoutSeconds: 60
  maxCalls: 1
workers:
  test:
    enabled: false
  coding:
    enabled: true
    agent: codex
    model: gpt-6.1-sol
    reasoningEffort: high
    validationWorkflow: null
  review: false
reporting:
  persistDecisions: true

notifications:
  slack:
    enabled: true
    channel: C0CGJKK3EKS # ki-notification
    maxPerRun: 20
    since: '2026-11-07T00:54:52Z' # Do not backfill earlier actions.
    events:
      run_started:
        enabled: true
        channel: null
      issue_created:
        enabled: true
        channel: null
      pr_merged:
        enabled: true
        channel: null
        actors: [] # Native Bot accounts only; human merges never match.

merge:
  enabled: true
  includeFactoryPRs: true
  adoptLabel: sf:automerge
  method: squash
  updateBranch: true
  requiredChecks: [ test-backend, test-frontend, test-docker ]
  validationWorkflow: test.yml
  maxReviewsPerRun: 1
  maxActionsPerRun: 1
  review:
    model: gpt-6.1-sol
    reasoningEffort: high
    timeoutSeconds: 120
    maxOutputTokens: 12000
    maxFiles: 60
    maxContextBytes: 250000
  postMergeWorkflows: [ docker-publish.yml ]
  # Risk-based auto-merge (Johannes, 2026-11-14): Factory merges up to medium risk on its own, above that a person approves.
  risk:
    enabled: true
    mode: enforce
    autoMergeUpTo: medium
deploy:
  enabled: false
