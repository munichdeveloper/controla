version: 1
factory:
  enabled: true
  scope: "Implement explicitly SF-managed Controla Community tasks with Codex.
    Independently review and conditionally merge Factory PRs and PRs explicitly
    enrolled with sf:automerge. Respect AGENTS.md, the Community/Premium
    boundary, feature flags and backwards-compatible extension APIs. Historical
    tasks from retired orchestrators are not automatically enrolled."
manager:
  workflow: factory-manager.yml
  maxActions: 10
  timeoutMinutes: 15
  maxContextTasks: 20
  maxContextChars: 20000
  trustedActors:
    - github-actions[bot]
    - munichdeveloper-sf-manager-local[bot]
autonomy:
  profile: autonomous
  overrides:
    transition: allow
    close_issue: allow
    create_followup: allow
    prioritize: allow
    approve_task: allow
    start_worker: allow
    retry_worker: allow
    cancel_worker: allow
    expand_scope: deny
    merge_pr: allow # Mandatory independent AI review and native GitHub gates still apply.
  # Johannes 2026-11-18: fully autonomous; every harness:managed task starts without a person's harness:ready.
  startGrant: none
execution:
  # Johannes 2026-11-20 (SF #188): one extra rescue attempt with workers.coding.retryAgents after the last regular one.
  rescue: { enabled: true, maxPerDay: 3 }
  dryRun: false
  maxParallelWorkers: 1
  maxRetries: 2
  maxNewIssues: 3
  workerTimeoutMinutes: 30
  dispatchGraceMinutes: 10
  engine: temporal
  # Johannes 2026-11-19 (controla#124 / PR #148): the Factory reworks AI review request_changes itself.
  rework: true
llm:
  # Temporarily deterministic (2026-11-18): OpenAI planning answered HTTP 429 on every pass, so no worker started.
  # Switch back to openai once the broker's OpenAI key has quota again.
  provider: static
  model: gpt-4.1-mini
  reasoningEffort: null
  maxOutputTokens: 4000
  timeoutSeconds: 60
  maxCalls: 1
workers:
  test:
    enabled: false
  coding:
    enabled: true
    agents:
      - agent: claude
        model: claude-sonnet-5-5
        reasoningEffort: medium
      - agent: codex
        model: gpt-6.1-sol
        reasoningEffort: high
    retryAgents:
      - agent: claude
        model: claude-opus-5-5
        reasoningEffort: high
      - agent: codex
        model: gpt-6.1-sol
        reasoningEffort: high
    validationWorkflow: null
  review: false
reporting:
  persistDecisions: true

notifications:
  slack:
    enabled: true
    channel: C0CGJKK3EKS # ki-notification
    maxPerRun: 20
    since: '2026-11-07T00:54:52Z' # Do not backfill earlier actions.
    events:
      attention_required:
        # Johannes 2026-11-21 (SF #188): the Factory cannot go on alone and needs a person.
        enabled: true
        channel: C0CJZDHJMSB # factory-todo
      start_refused:
        # Johannes 2026-11-21 (SF #188): starts refused for the whole repository (at most once per code and day).
        enabled: true
        channel: C0CJZDHJMSB # factory-todo
      run_started:
        enabled: true
        channel: null
      approval_required:
        # A PR above merge.risk.autoMergeUpTo waits for /harness approve.
        enabled: true
        channel: null
      grant_required:
        # A task waits for nothing but a person's harness:ready (software-factory#127).
        enabled: true
        channel: null
      issue_created:
        enabled: true
        channel: null
      pr_merged:
        enabled: true
        channel: null
        actors: [] # Native Bot accounts only; human merges never match.

merge:
  enabled: true
  includeFactoryPRs: true
  adoptLabel: sf:automerge
  method: squash
  updateBranch: true
  requiredChecks: [ test-backend, test-frontend, test-docker ]
  validationWorkflow: test.yml
  maxReviewsPerRun: 1
  maxActionsPerRun: 1
  review:
    provider: openai # keeps the independent OpenAI review while planning is deterministic (llm.provider mock)
    model: gpt-6.1-sol
    reasoningEffort: high
    timeoutSeconds: 120
    maxOutputTokens: 12000
    maxFiles: 60
    maxContextBytes: 250000
  postMergeWorkflows: [ docker-publish.yml ]
  # Risk-based auto-merge (Johannes, 2026-11-14): Factory merges up to medium risk on its own, above that a person approves.
  risk:
    enabled: true
    mode: enforce
    autoMergeUpTo: medium
    # Like merge.review: the assessor calls a real model while planning is deterministic (llm.provider mock);
    # with provider llm it refuses and every PR counted as critical. The broker asks Claude first, OpenAI second.
    assessor:
      provider: openai
deploy:
  enabled: false

# Model router (Johannes, 2026-11-19, SF 0.16.0): TypeSafe Jev picks model and effort per call from these candidates.
# Without the broker's OpenRouter key, or on low confidence, the configured models run and Slack reports it.
router:
  enabled: true
  model: typesafe/jev-1.14
  # Johannes 2026-11-19: Jev chooses freely from the full model x effort matrix. With 11 options an even split is 9 %,
  # so 0.25 already means a clear lean; below it the configured workers.coding.agents run.
  minConfidence: 0.25
  timeoutSeconds: 10
  coding:
    candidates:
      - id: haiku-low
        agent: claude
        model: claude-haiku-5-5
        reasoningEffort: low
        description: "Trivial edits: typos, texts, config values, a one-line fix with an
          obvious place."
      - id: haiku-medium
        agent: claude
        model: claude-haiku-5-5
        reasoningEffort: medium
        description: "Small, fully specified change in one or two files that follows an
          existing pattern."
      - id: haiku-high
        agent: claude
        model: claude-haiku-5-5
        reasoningEffort: high
        description: "Small change in one area that needs some care, e.g. a simple test
          or a small UI tweak."
      - id: sonnet-low
        agent: claude
        model: claude-sonnet-5-5
        reasoningEffort: low
        description: "Routine contained change with clear acceptance criteria and little
          reasoning needed."
      - id: sonnet-medium
        agent: claude
        model: claude-sonnet-5-5
        reasoningEffort: medium
        description: "Clearly specified, contained changes in one area; bug fixes, small
          features, texts, tests."
      - id: sonnet-high
        agent: claude
        model: claude-sonnet-5-5
        reasoningEffort: high
        description: "Medium feature touching a few files, or a bug whose cause still
          has to be found."
      - id: opus-low
        agent: claude
        model: claude-opus-5-5
        reasoningEffort: low
        description: "Broad but well understood change where judgement matters more than
          deep reasoning."
      - id: opus-medium
        agent: claude
        model: claude-opus-5-5
        reasoningEffort: medium
        description: "Changes across several modules or a non-trivial feature with some
          design decisions."
      - id: opus-high
        agent: claude
        model: claude-opus-5-5
        reasoningEffort: high
        description: "New architecture, migrations, security, concurrency or hard
          debugging across modules."
      - id: codex-medium
        agent: codex
        model: gpt-6.1-sol
        reasoningEffort: medium
        description: "Mechanical change across many files with a clear rule, e.g.
          renames or API updates."
      - id: codex-high
        agent: codex
        model: gpt-6.1-sol
        reasoningEffort: high
        description: "Mostly mechanical but wide changes, refactorings and renames
          across many files."
  review:
    candidates:
      - id: haiku-low
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: low
        description: "Tiny pull requests: texts, docs, config values, one-line fixes."
      - id: haiku-medium
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: medium
        description: "Small pull requests with one clear purpose in one or two files."
      - id: haiku-high
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: high
        description: "Small pull requests where a mistake would still be easy to spot."
      - id: sonnet-low
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: low
        description: "Routine pull requests of a few files with low behavioural impact."
      - id: sonnet-medium
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: medium
        description: "Small to medium pull requests with few files and a clear purpose."
      - id: sonnet-high
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: high
        description: "Medium pull requests that change behaviour in several files."
      - id: opus-low
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: low
        description: "Large but mechanical pull requests, e.g. renames across many files."
      - id: opus-medium
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: medium
        description: "Large pull requests or ones touching shared modules."
      - id: opus-high
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: high
        description: "Security, authentication, payments, data migrations, deployment or
          concurrency changes."
  risk:
    candidates:
      - id: haiku-low
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: low
        description: "Tiny pull requests: texts, docs, config values, one-line fixes."
      - id: haiku-medium
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: medium
        description: "Small pull requests with one clear purpose in one or two files."
      - id: haiku-high
        provider: claude
        model: claude-haiku-5-5
        reasoningEffort: high
        description: "Small pull requests where a mistake would still be easy to spot."
      - id: sonnet-low
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: low
        description: "Routine pull requests of a few files with low behavioural impact."
      - id: sonnet-medium
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: medium
        description: "Small to medium pull requests with few files and a clear purpose."
      - id: sonnet-high
        provider: claude
        model: claude-sonnet-5-5
        reasoningEffort: high
        description: "Medium pull requests that change behaviour in several files."
      - id: opus-low
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: low
        description: "Large but mechanical pull requests, e.g. renames across many files."
      - id: opus-medium
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: medium
        description: "Large pull requests or ones touching shared modules."
      - id: opus-high
        provider: claude
        model: claude-opus-5-5
        reasoningEffort: high
        description: "Security, authentication, payments, data migrations, deployment or
          concurrency changes."
