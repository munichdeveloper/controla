version: 1
factory:
  enabled: true
  scope: "Coordinate explicitly SF-managed Controla Community tasks only. Respect AGENTS.md, the Community/Premium boundary, feature flags and existing pi-spec-harness runs. Use only the non-mutating test worker; do not take over active tasks from other orchestrators."
manager:
  workflow: factory-manager.yml
  maxActions: 10
  timeoutMinutes: 15
  maxContextTasks: 20
  maxContextChars: 20000
  trustedActors: ["github-actions[bot]"]
autonomy:
  profile: autonomous
  overrides:
    transition: allow
    close_issue: allow
    create_followup: allow
    prioritize: allow
    approve_task: allow
    start_worker: allow
    retry_worker: allow
    cancel_worker: allow
    expand_scope: allow
    merge_pr: deny # Not implemented in SF v0.1.0; repository rules remain authoritative.
execution:
  dryRun: false
  maxParallelWorkers: 1
  maxRetries: 2
  maxNewIssues: 3
  workerTimeoutMinutes: 30
  dispatchGraceMinutes: 10
llm:
  provider: openai
  model: gpt-4.1-mini
  reasoningEffort: null
  maxOutputTokens: 4000
  timeoutSeconds: 60
  maxCalls: 1
workers:
  test:
    enabled: true
    operation: sha256
  coding: false
  review: false
reporting:
  persistDecisions: true
